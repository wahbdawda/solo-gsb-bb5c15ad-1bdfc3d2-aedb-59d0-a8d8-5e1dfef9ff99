services:
  uploader:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      # Idle lease applied when a client omits idle_timeout_seconds (max 604800).
      DEFAULT_IDLE_TIMEOUT_SECONDS: "86400"
      # How often the background reaper scans for expired sessions (seconds).
      # Set to "0" to disable the background scan (startup recovery still runs).
      REAPER_INTERVAL_SECONDS: "300"
    volumes:
      - upload-data:/data
    restart: unless-stopped

volumes:
  upload-data:
